<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground de Clusterização — Aula 7</title>
<style>
:root {
  --bg-dark: #1a1a2e;
  --bg-panel: #f8f9fa;
  --bg-card: #ffffff;
  --text-dark: #1a1a2e;
  --text-light: #e0e0e0;
  --text-muted: #6c757d;
  --accent: #4363d8;
  --accent-hover: #3451b8;
  --border: #dee2e6;
  --shadow: 0 2px 12px rgba(0,0,0,0.15);
  --radius: 10px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: #0f0f23;
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
}

header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #fff;
  padding: 16px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
header .badge {
  background: var(--accent);
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.04em;
}

.app {
  display: grid;
  grid-template-columns: 1fr 320px;
  grid-template-rows: auto auto;
  gap: 16px;
  padding: 16px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Main canvas area */
.canvas-area {
  grid-column: 1;
  grid-row: 1;
  background: var(--bg-dark);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.canvas-area .canvas-label {
  color: var(--text-light);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 10px 0 4px;
  opacity: 0.7;
}
#mainCanvas {
  display: block;
  cursor: crosshair;
  max-width: 100%;
}

/* Tooltip */
.tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(26,26,46,0.93);
  color: #fff;
  font-size: 0.78rem;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.15);
  display: none;
  z-index: 50;
  line-height: 1.5;
  max-width: 220px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}

/* Controls panel */
.controls {
  grid-column: 2;
  grid-row: 1;
  background: var(--bg-panel);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  max-height: calc(100vh - 120px);
}
.controls h2 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.ctrl-group { display: flex; flex-direction: column; gap: 6px; }
.ctrl-group label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-dark);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ctrl-group label span.val {
  font-weight: 400;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

select, input[type=range] { width: 100%; }
select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: var(--font);
  font-size: 0.88rem;
  background: #fff;
  cursor: pointer;
  appearance: auto;
}
select:focus, input[type=range]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

input[type=range] {
  -webkit-appearance: none;
  height: 6px;
  border-radius: 3px;
  background: #dde1e7;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  cursor: grab;
}

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  flex: 1;
  min-width: 70px;
  padding: 10px 8px;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary.running { background: #e6194b; }
.btn-secondary { background: #e9ecef; color: var(--text-dark); }
.btn-secondary:hover { background: #dee2e6; }
.btn-step { background: #16213e; color: #fff; }
.btn-step:hover { background: #1a2744; }

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: var(--text-muted);
  padding: 6px 0;
  border-top: 1px solid var(--border);
}
.status-bar .iter { font-weight: 600; color: var(--text-dark); }
.status-bar .converged {
  background: #d4edda;
  color: #155724;
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 0.75rem;
  display: none;
}
.status-bar .converged.show { display: inline-block; }

.divider { height: 1px; background: var(--border); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  color: var(--text-muted);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Bottom charts */
.charts-area {
  grid-column: 1 / -1;
  grid-row: 2;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.chart-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chart-card h3 {
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.chart-card canvas {
  width: 100%;
  max-width: 100%;
  border-radius: 6px;
  background: #fafbfc;
}
.chart-card .score {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
}

/* Responsive */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }
  .controls {
    grid-column: 1;
    grid-row: 2;
    max-height: none;
  }
  .charts-area {
    grid-column: 1;
    grid-row: 3;
    grid-template-columns: 1fr;
  }
}

/* Scrollbar */
.controls::-webkit-scrollbar { width: 6px; }
.controls::-webkit-scrollbar-track { background: transparent; }
.controls::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

/* Info section in controls */
.info-box {
  background: #e8f0fe;
  border-left: 3px solid var(--accent);
  padding: 10px 12px;
  border-radius: 0 8px 8px 0;
  font-size: 0.78rem;
  line-height: 1.5;
  color: #1a1a2e;
}
</style>
</head>
<body>

<header>
  <h1>🧪 Playground de Clusterização — Aula 7</h1>
  <span class="badge">K-Means · K-Medoids · DBSCAN</span>
</header>

<div class="app">
  <!-- Main Canvas -->
  <div class="canvas-area">
    <span class="canvas-label">Espaço PCA — PC1 × PC2</span>
    <canvas id="mainCanvas" width="560" height="560"></canvas>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <!-- Controls Panel -->
  <div class="controls">
    <h2>Controles</h2>

    <div class="ctrl-group">
      <label>Algoritmo</label>
      <select id="selAlgo">
        <option value="kmeans">K-Means</option>
        <option value="kmedoids">K-Medoids</option>
        <option value="dbscan">DBSCAN</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Dataset</label>
      <select id="selDataset">
        <option value="3clusters">Países (3 grupos)</option>
        <option value="5clusters">Países (5 grupos)</option>
        <option value="ring">Anel + Centro</option>
        <option value="random">Aleatório</option>
      </select>
    </div>

    <div class="ctrl-group" id="grpK">
      <label>Clusters (K) <span class="val" id="valK">3</span></label>
      <input type="range" id="sliderK" min="2" max="8" value="3" step="1">
    </div>

    <div class="ctrl-group" id="grpEps" style="display:none">
      <label>eps <span class="val" id="valEps">1.5</span></label>
      <input type="range" id="sliderEps" min="0.5" max="4.0" value="1.5" step="0.1">
    </div>

    <div class="ctrl-group" id="grpMinPts" style="display:none">
      <label>minPts <span class="val" id="valMinPts">5</span></label>
      <input type="range" id="sliderMinPts" min="3" max="15" value="5" step="1">
    </div>

    <div class="ctrl-group">
      <label>Velocidade da animação <span class="val" id="valSpeed">Média</span></label>
      <input type="range" id="sliderSpeed" min="1" max="5" value="3" step="1">
    </div>

    <div class="divider"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnRun">▶ Executar</button>
      <button class="btn btn-step" id="btnStep">↻ Passo</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnReset" style="flex:1">🔄 Reiniciar</button>
    </div>

    <div class="status-bar">
      <span>Iteração: <span class="iter" id="iterLabel">0</span></span>
      <span class="converged" id="convergedLabel">✓ Convergiu!</span>
    </div>

    <div class="divider"></div>

    <div id="legendBox" class="legend"></div>

    <div class="info-box" id="infoBox">
      <strong>Dica:</strong> Clique em <em>Executar</em> para ver o algoritmo passo a passo. Use <em>Passo</em> para avançar uma iteração por vez.
    </div>
  </div>

  <!-- Bottom Charts -->
  <div class="charts-area">
    <div class="chart-card">
      <h3>📐 Método do Cotovelo (WSS)</h3>
      <canvas id="elbowCanvas" width="500" height="200"></canvas>
    </div>
    <div class="chart-card">
      <h3>📊 Silhueta <span class="score" id="silScore"></span></h3>
      <canvas id="silCanvas" width="500" height="200"></canvas>
    </div>
  </div>
</div>

<script>
// ===================== CONSTANTS =====================
const COLORS = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#bfef45'];
const NOISE_COLOR = '#888888';
const CANVAS_W = 560, CANVAS_H = 560;
const PADDING = 30;

// ===================== DOM REFS =====================
const mainCanvas = document.getElementById('mainCanvas');
const ctx = mainCanvas.getContext('2d');
const elbowCanvas = document.getElementById('elbowCanvas');
const ectx = elbowCanvas.getContext('2d');
const silCanvas = document.getElementById('silCanvas');
const sctx = silCanvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const selAlgo = document.getElementById('selAlgo');
const selDataset = document.getElementById('selDataset');
const sliderK = document.getElementById('sliderK');
const sliderEps = document.getElementById('sliderEps');
const sliderMinPts = document.getElementById('sliderMinPts');
const sliderSpeed = document.getElementById('sliderSpeed');
const valK = document.getElementById('valK');
const valEps = document.getElementById('valEps');
const valMinPts = document.getElementById('valMinPts');
const valSpeed = document.getElementById('valSpeed');
const grpK = document.getElementById('grpK');
const grpEps = document.getElementById('grpEps');
const grpMinPts = document.getElementById('grpMinPts');
const btnRun = document.getElementById('btnRun');
const btnStep = document.getElementById('btnStep');
const btnReset = document.getElementById('btnReset');
const iterLabel = document.getElementById('iterLabel');
const convergedLabel = document.getElementById('convergedLabel');
const legendBox = document.getElementById('legendBox');
const infoBox = document.getElementById('infoBox');
const silScore = document.getElementById('silScore');

// ===================== STATE =====================
let points = [];
let centroids = [];
let iteration = 0;
let converged = false;
let running = false;
let animTimer = null;
let currentAlgo = 'kmeans';
let hoveredPoint = null;

// ===================== UTILITY =====================
function gaussRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function getK() { return parseInt(sliderK.value); }
function getEps() { return parseFloat(sliderEps.value); }
function getMinPts() { return parseInt(sliderMinPts.value); }
function getSpeed() { return parseInt(sliderSpeed.value); }

function getDelay() {
  const speeds = [800, 500, 300, 150, 60];
  return speeds[getSpeed() - 1];
}

function speedLabel(v) {
  return ['Muito lenta','Lenta','Média','Rápida','Muito rápida'][v - 1];
}

// ===================== DATA GENERATION =====================
function generateData(type) {
  points = [];
  const countryNames = [
    'Brasil','Argentina','Chile','Colômbia','México','Peru','Uruguai','Paraguai',
    'EUA','Canadá','Alemanha','França','Japão','Coreia','Austrália','Noruega',
    'Índia','China','Indonésia','Nigéria','Egito','Bangladesh','Paquistão','Quênia',
    'Rússia','Turquia','África do Sul','Tailândia','Vietnã','Filipinas',
    'Suécia','Dinamarca','Finlândia','Holanda','Bélgica','Suíça',
    'Marrocos','Gana','Tanzânia','Etiópia','Senegal','Camarões'
  ];
  let nameIdx = 0;
  function nextName() { return countryNames[nameIdx++ % countryNames.length]; }

  function addBlob(cx, cy, n, spread) {
    for (let i = 0; i < n; i++) {
      points.push({
        x: cx + gaussRandom() * spread,
        y: cy + gaussRandom() * spread,
        name: nextName(),
        cluster: -1,
        trueCluster: points.length,
        indicador1: +(Math.random() * 100).toFixed(1),
        indicador2: +(Math.random() * 100).toFixed(1)
      });
    }
  }

  if (type === '3clusters') {
    addBlob(160, 160, 50, 38);
    addBlob(390, 180, 50, 38);
    addBlob(270, 400, 50, 42);
  } else if (type === '5clusters') {
    addBlob(130, 130, 35, 32);
    addBlob(400, 130, 35, 32);
    addBlob(270, 280, 35, 32);
    addBlob(130, 420, 35, 32);
    addBlob(420, 420, 35, 32);
  } else if (type === 'ring') {
    // Ring of points
    const nRing = 120;
    for (let i = 0; i < nRing; i++) {
      const angle = (2 * Math.PI * i) / nRing + gaussRandom() * 0.08;
      const r = 160 + gaussRandom() * 18;
      points.push({
        x: 280 + Math.cos(angle) * r,
        y: 280 + Math.sin(angle) * r,
        name: nextName(),
        cluster: -1,
        trueCluster: 0,
        indicador1: +(Math.random() * 100).toFixed(1),
        indicador2: +(Math.random() * 100).toFixed(1)
      });
    }
    // Center blob
    addBlob(280, 280, 50, 30);
  } else {
    // Random scatter
    for (let i = 0; i < 150; i++) {
      points.push({
        x: PADDING + Math.random() * (CANVAS_W - 2 * PADDING),
        y: PADDING + Math.random() * (CANVAS_H - 2 * PADDING),
        name: nextName(),
        cluster: -1,
        trueCluster: -1,
        indicador1: +(Math.random() * 100).toFixed(1),
        indicador2: +(Math.random() * 100).toFixed(1)
      });
    }
  }

  // Clamp points to canvas
  points.forEach(p => {
    p.x = Math.max(PADDING, Math.min(CANVAS_W - PADDING, p.x));
    p.y = Math.max(PADDING, Math.min(CANVAS_H - PADDING, p.y));
  });
}

// ===================== K-MEANS =====================
function initCentroids(k) {
  centroids = [];
  const indices = new Set();
  while (indices.size < k) {
    indices.add(Math.floor(Math.random() * points.length));
  }
  for (const idx of indices) {
    centroids.push({ x: points[idx].x, y: points[idx].y });
  }
}

function assignClusters() {
  points.forEach(p => {
    let minD = Infinity, closest = 0;
    centroids.forEach((c, i) => {
      const d = dist(p, c);
      if (d < minD) { minD = d; closest = i; }
    });
    p.cluster = closest;
  });
}

function kmeansStep() {
  if (converged) return true;
  const oldCentroids = centroids.map(c => ({ x: c.x, y: c.y }));

  assignClusters();

  // Recalculate centroids
  centroids.forEach((c, i) => {
    const members = points.filter(p => p.cluster === i);
    if (members.length > 0) {
      c.x = members.reduce((s, p) => s + p.x, 0) / members.length;
      c.y = members.reduce((s, p) => s + p.y, 0) / members.length;
    }
  });

  iteration++;
  // Check convergence
  let maxMove = 0;
  centroids.forEach((c, i) => {
    maxMove = Math.max(maxMove, dist(c, oldCentroids[i]));
  });
  converged = maxMove < 0.5;
  return converged;
}

// ===================== K-MEDOIDS =====================
function kmedoidsStep() {
  if (converged) return true;

  // Assign to nearest medoid
  assignClusters();

  // Recalculate medoids: for each cluster, find the point closest to the mean
  const oldCentroids = centroids.map(c => ({ x: c.x, y: c.y }));
  centroids.forEach((c, i) => {
    const members = points.filter(p => p.cluster === i);
    if (members.length > 0) {
      const meanX = members.reduce((s, p) => s + p.x, 0) / members.length;
      const meanY = members.reduce((s, p) => s + p.y, 0) / members.length;
      let bestDist = Infinity, bestPt = members[0];
      members.forEach(p => {
        const d = Math.hypot(p.x - meanX, p.y - meanY);
        if (d < bestDist) { bestDist = d; bestPt = p; }
      });
      c.x = bestPt.x;
      c.y = bestPt.y;
    }
  });

  iteration++;
  let maxMove = 0;
  centroids.forEach((c, i) => {
    maxMove = Math.max(maxMove, dist(c, oldCentroids[i]));
  });
  converged = maxMove < 0.5;
  return converged;
}

// ===================== DBSCAN =====================
function runDBSCAN() {
  const eps = getEps() * 30; // scale to pixel space
  const minPts = getMinPts();

  points.forEach(p => { p.cluster = -1; p.visited = false; });

  let clusterId = -1;

  function regionQuery(p) {
    return points.filter(q => dist(p, q) <= eps);
  }

  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.visited) continue;
    p.visited = true;
    const neighbors = regionQuery(p);

    if (neighbors.length < minPts) {
      p.cluster = -1; // noise
    } else {
      clusterId++;
      p.cluster = clusterId;
      const seedSet = [...neighbors];
      let idx = 0;
      while (idx < seedSet.length) {
        const q = seedSet[idx];
        if (!q.visited) {
          q.visited = true;
          const qNeighbors = regionQuery(q);
          if (qNeighbors.length >= minPts) {
            qNeighbors.forEach(n => {
              if (!seedSet.includes(n)) seedSet.push(n);
            });
          }
        }
        if (q.cluster === -1 || q.cluster === undefined) {
          q.cluster = clusterId;
        }
        idx++;
      }
    }
  }

  // Clean up visited flags
  points.forEach(p => delete p.visited);

  // Build centroids for visualization
  centroids = [];
  const nClusters = clusterId + 1;
  for (let i = 0; i < nClusters; i++) {
    const members = points.filter(p => p.cluster === i);
    if (members.length > 0) {
      centroids.push({
        x: members.reduce((s, p) => s + p.x, 0) / members.length,
        y: members.reduce((s, p) => s + p.y, 0) / members.length
      });
    }
  }

  iteration = 1;
  converged = true;
  return true;
}

// ===================== ELBOW CHART =====================
function computeWSS(pts, cents) {
  let wss = 0;
  pts.forEach(p => {
    if (p.cluster >= 0 && p.cluster < cents.length) {
      wss += Math.pow(dist(p, cents[p.cluster]), 2);
    }
  });
  return wss;
}

function quickKMeans(pts, k) {
  // Simple K-Means for elbow computation
  let cents = [];
  const indices = new Set();
  while (indices.size < k && indices.size < pts.length) {
    indices.add(Math.floor(Math.random() * pts.length));
  }
  for (const idx of indices) cents.push({ x: pts[idx].x, y: pts[idx].y });

  for (let iter = 0; iter < 30; iter++) {
    pts.forEach(p => {
      let minD = Infinity, closest = 0;
      cents.forEach((c, i) => {
        const d = dist(p, c);
        if (d < minD) { minD = d; closest = i; }
      });
      p._tmpCluster = closest;
    });
    cents.forEach((c, i) => {
      const members = pts.filter(p => p._tmpCluster === i);
      if (members.length > 0) {
        c.x = members.reduce((s, p) => s + p.x, 0) / members.length;
        c.y = members.reduce((s, p) => s + p.y, 0) / members.length;
      }
    });
  }
  let wss = 0;
  pts.forEach(p => {
    wss += Math.pow(dist(p, cents[p._tmpCluster]), 2);
  });
  pts.forEach(p => delete p._tmpCluster);
  return wss;
}

function drawElbow() {
  const W = elbowCanvas.width, H = elbowCanvas.height;
  const pad = { t: 20, r: 20, b: 35, l: 55 };
  ectx.clearRect(0, 0, W, H);

  const wssValues = [];
  const maxK = 8;
  for (let k = 1; k <= maxK; k++) {
    if (k === 1) {
      // WSS for K=1: all points to global mean
      const mx = points.reduce((s, p) => s + p.x, 0) / points.length;
      const my = points.reduce((s, p) => s + p.y, 0) / points.length;
      wssValues.push(points.reduce((s, p) => s + Math.pow(dist(p, {x:mx,y:my}), 2), 0));
    } else {
      // Run quick K-Means multiple times and take best
      let bestWSS = Infinity;
      for (let trial = 0; trial < 5; trial++) {
        const w = quickKMeans(points, k);
        if (w < bestWSS) bestWSS = w;
      }
      wssValues.push(bestWSS);
    }
  }

  const maxWSS = Math.max(...wssValues) * 1.1;
  const chartW = W - pad.l - pad.r;
  const chartH = H - pad.t - pad.b;

  // Axes
  ectx.strokeStyle = '#ccc';
  ectx.lineWidth = 1;
  ectx.beginPath();
  ectx.moveTo(pad.l, pad.t);
  ectx.lineTo(pad.l, pad.t + chartH);
  ectx.lineTo(pad.l + chartW, pad.t + chartH);
  ectx.stroke();

  // Grid lines
  ectx.strokeStyle = '#eee';
  ectx.setLineDash([3, 3]);
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + chartH - (chartH * i / 4);
    ectx.beginPath();
    ectx.moveTo(pad.l, y);
    ectx.lineTo(pad.l + chartW, y);
    ectx.stroke();
  }
  ectx.setLineDash([]);

  // Line
  ectx.strokeStyle = '#4363d8';
  ectx.lineWidth = 2.5;
  ectx.beginPath();
  const coords = [];
  for (let k = 0; k < maxK; k++) {
    const x = pad.l + (chartW * k / (maxK - 1));
    const y = pad.t + chartH - (chartH * wssValues[k] / maxWSS);
    coords.push({x, y, k: k + 1});
    if (k === 0) ectx.moveTo(x, y);
    else ectx.lineTo(x, y);
  }
  ectx.stroke();

  // Points
  coords.forEach(({x, y, k}) => {
    ectx.fillStyle = (k === getK()) ? '#e6194b' : '#4363d8';
    ectx.beginPath();
    ectx.arc(x, y, (k === getK()) ? 6 : 4, 0, Math.PI * 2);
    ectx.fill();
    ectx.fillStyle = '#333';
    ectx.font = '11px Inter, system-ui, sans-serif';
    ectx.textAlign = 'center';
    ectx.fillText(`K=${k}`, x, pad.t + chartH + 18);
  });

  // Current K vertical line
  const curK = getK();
  if (curK >= 1 && curK <= maxK) {
    const xPos = pad.l + (chartW * (curK - 1) / (maxK - 1));
    ectx.strokeStyle = 'rgba(230,25,75,0.4)';
    ectx.lineWidth = 2;
    ectx.setLineDash([5, 4]);
    ectx.beginPath();
    ectx.moveTo(xPos, pad.t);
    ectx.lineTo(xPos, pad.t + chartH);
    ectx.stroke();
    ectx.setLineDash([]);
  }

  // Y-axis label
  ectx.save();
  ectx.fillStyle = '#666';
  ectx.font = '11px Inter, system-ui, sans-serif';
  ectx.textAlign = 'center';
  ectx.translate(14, pad.t + chartH / 2);
  ectx.rotate(-Math.PI / 2);
  ectx.fillText('WSS (Inércia)', 0, 0);
  ectx.restore();

  // X-axis label
  ectx.fillStyle = '#666';
  ectx.font = '11px Inter, system-ui, sans-serif';
  ectx.textAlign = 'center';
  ectx.fillText('Número de Clusters (K)', pad.l + chartW / 2, H - 4);
}

// ===================== SILHOUETTE CHART =====================
function computeSilhouette() {
  if (points.length < 2) return [];

  const clusters = {};
  points.forEach(p => {
    if (p.cluster < 0) return;
    if (!clusters[p.cluster]) clusters[p.cluster] = [];
    clusters[p.cluster].push(p);
  });

  const clusterKeys = Object.keys(clusters).map(Number);
  if (clusterKeys.length < 2) return [];

  const silhouetteValues = [];

  points.forEach(p => {
    if (p.cluster < 0) {
      silhouetteValues.push(-1);
      return;
    }

    // a(i): avg distance to points in same cluster
    const sameCluster = clusters[p.cluster].filter(q => q !== p);
    let a = 0;
    if (sameCluster.length > 0) {
      a = sameCluster.reduce((s, q) => s + dist(p, q), 0) / sameCluster.length;
    }

    // b(i): min avg distance to points in other clusters
    let b = Infinity;
    clusterKeys.forEach(k => {
      if (k === p.cluster) return;
      const otherCluster = clusters[k];
      const avgDist = otherCluster.reduce((s, q) => s + dist(p, q), 0) / otherCluster.length;
      if (avgDist < b) b = avgDist;
    });

    const s = (b - a) / Math.max(a, b, 1e-10);
    silhouetteValues.push(s);
  });

  return silhouetteValues;
}

function drawSilhouette() {
  const W = silCanvas.width, H = silCanvas.height;
  const pad = { t: 20, r: 20, b: 35, l: 50 };
  sctx.clearRect(0, 0, W, H);

  const silValues = computeSilhouette();
  const chartW = W - pad.l - pad.r;
  const chartH = H - pad.t - pad.b;

  if (silValues.length === 0 || points.length === 0) {
    sctx.fillStyle = '#aaa';
    sctx.font = '13px Inter, system-ui, sans-serif';
    sctx.textAlign = 'center';
    sctx.fillText('Execute um algoritmo para ver a silhueta', W / 2, H / 2);
    silScore.textContent = '';
    return;
  }

  // Sort points by cluster then silhouette value for nicer display
  const indexed = points.map((p, i) => ({
    cluster: p.cluster,
    sil: silValues[i],
    idx: i
  })).filter(d => d.cluster >= 0).sort((a, b) => a.cluster - b.cluster || b.sil - a.sil);

  const n = indexed.length;
  if (n === 0) {
    sctx.fillStyle = '#aaa';
    sctx.font = '13px Inter, system-ui, sans-serif';
    sctx.textAlign = 'center';
    sctx.fillText('Sem clusters válidos', W / 2, H / 2);
    silScore.textContent = '';
    return;
  }

  const barW = Math.max(1, chartW / n - 1);

  // Zero line
  const zeroY = pad.t + chartH / 2;
  sctx.strokeStyle = '#999';
  sctx.lineWidth = 1;
  sctx.setLineDash([4, 3]);
  sctx.beginPath();
  sctx.moveTo(pad.l, zeroY);
  sctx.lineTo(pad.l + chartW, zeroY);
  sctx.stroke();
  sctx.setLineDash([]);

  // Draw bars
  indexed.forEach((d, i) => {
    const x = pad.l + (chartW * i / n);
    const barH = (d.sil / 2) * chartH; // s ranges from -1 to 1, map to half chart
    const y = zeroY - barH;
    sctx.fillStyle = COLORS[d.cluster % COLORS.length];
    sctx.fillRect(x, Math.min(y, zeroY), Math.max(barW, 1.5), Math.abs(barH));
  });

  // Axes
  sctx.strokeStyle = '#ccc';
  sctx.lineWidth = 1;
  sctx.beginPath();
  sctx.moveTo(pad.l, pad.t);
  sctx.lineTo(pad.l, pad.t + chartH);
  sctx.lineTo(pad.l + chartW, pad.t + chartH);
  sctx.stroke();

  // Y labels
  sctx.fillStyle = '#666';
  sctx.font = '10px Inter, system-ui, sans-serif';
  sctx.textAlign = 'right';
  sctx.fillText('1.0', pad.l - 6, pad.t + 4);
  sctx.fillText('0.0', pad.l - 6, zeroY + 4);
  sctx.fillText('-1.0', pad.l - 6, pad.t + chartH + 4);

  // X label
  sctx.fillStyle = '#666';
  sctx.font = '11px Inter, system-ui, sans-serif';
  sctx.textAlign = 'center';
  sctx.fillText('Amostras (ordenadas por cluster)', pad.l + chartW / 2, H - 4);

  // Average silhouette
  const validSil = indexed.map(d => d.sil);
  const avg = validSil.reduce((s, v) => s + v, 0) / validSil.length;
  silScore.textContent = `Média: ${avg.toFixed(3)}`;

  // Average line
  const avgY = zeroY - (avg / 2) * chartH;
  sctx.strokeStyle = '#e6194b';
  sctx.lineWidth = 2;
  sctx.setLineDash([6, 3]);
  sctx.beginPath();
  sctx.moveTo(pad.l, avgY);
  sctx.lineTo(pad.l + chartW, avgY);
  sctx.stroke();
  sctx.setLineDash([]);
}

// ===================== DRAWING =====================
function drawMain() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Background grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= CANVAS_W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); ctx.stroke();
  }
  for (let y = 0; y <= CANVAS_H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); ctx.stroke();
  }

  // Axis labels
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '12px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('PC1', CANVAS_W / 2, CANVAS_H - 8);
  ctx.save();
  ctx.translate(14, CANVAS_H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('PC2', 0, 0);
  ctx.restore();

  // Draw points
  const isDBSCAN = currentAlgo === 'dbscan';

  points.forEach(p => {
    const color = (p.cluster < 0) ? NOISE_COLOR : COLORS[p.cluster % COLORS.length];
    const isHovered = hoveredPoint === p;
    const r = isHovered ? 7 : 5;

    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    if (isHovered) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // Draw centroids
  if (centroids.length > 0 && iteration > 0) {
    if (currentAlgo === 'kmedoids') {
      // Draw medoid as a filled diamond
      centroids.forEach((c, i) => {
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y - 10);
        ctx.lineTo(c.x + 8, c.y);
        ctx.lineTo(c.x, c.y + 10);
        ctx.lineTo(c.x - 8, c.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      });
    } else if (currentAlgo === 'kmeans') {
      // Draw centroid as X
      centroids.forEach((c, i) => {
        ctx.strokeStyle = COLORS[i % COLORS.length];
        ctx.lineWidth = 3;
        const s = 10;
        ctx.beginPath();
        ctx.moveTo(c.x - s, c.y - s);
        ctx.lineTo(c.x + s, c.y + s);
        ctx.moveTo(c.x + s, c.y - s);
        ctx.lineTo(c.x - s, c.y + s);
        ctx.stroke();

        // White outline
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(c.x - s, c.y - s);
        ctx.lineTo(c.x + s, c.y + s);
        ctx.moveTo(c.x + s, c.y - s);
        ctx.lineTo(c.x - s, c.y + s);
        ctx.stroke();
      });
    } else {
      // DBSCAN: draw cluster centers as small squares
      centroids.forEach((c, i) => {
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.fillRect(c.x - 6, c.y - 6, 12, 12);
        ctx.strokeRect(c.x - 6, c.y - 6, 12, 12);
      });
    }
  }

  // Draw iteration counter on canvas
  if (iteration > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = 'bold 12px Inter, system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`Iter: ${iteration}`, CANVAS_W - 12, 20);
  }
}

// ===================== LEGEND =====================
function updateLegend() {
  legendBox.innerHTML = '';
  const k = currentAlgo === 'dbscan' ? centroids.length : getK();
  for (let i = 0; i < k; i++) {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<span class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></span>Cluster ${i + 1}`;
    legendBox.appendChild(div);
  }
  if (currentAlgo === 'dbscan') {
    const noiseCount = points.filter(p => p.cluster === -1).length;
    if (noiseCount > 0) {
      const div = document.createElement('div');
      div.className = 'legend-item';
      div.innerHTML = `<span class="legend-dot" style="background:${NOISE_COLOR}"></span>Ruído (${noiseCount})`;
      legendBox.appendChild(div);
    }
  }
}

// ===================== ALGORITHM CONTROL =====================
function initAlgorithm() {
  currentAlgo = selAlgo.value;
  const k = getK();

  if (currentAlgo === 'kmeans' || currentAlgo === 'kmedoids') {
    initCentroids(k);
  } else {
    centroids = [];
  }

  iteration = 0;
  converged = false;
  points.forEach(p => { p.cluster = -1; });
  updateUI();
}

function doStep() {
  if (converged) {
    stopRunning();
    return;
  }

  let done = false;
  if (currentAlgo === 'kmeans') {
    done = kmeansStep();
  } else if (currentAlgo === 'kmedoids') {
    done = kmedoidsStep();
  } else if (currentAlgo === 'dbscan') {
    done = runDBSCAN();
  }

  updateUI();
  drawMain();
  drawSilhouette();

  if (done) {
    stopRunning();
    drawElbow();
  }
}

function startRunning() {
  if (converged) return;
  running = true;
  btnRun.textContent = '⏸ Pausar';
  btnRun.classList.add('running');

  function tick() {
    if (!running || converged) {
      stopRunning();
      return;
    }
    doStep();
    if (!converged) {
      animTimer = setTimeout(tick, getDelay());
    }
  }
  tick();
}

function stopRunning() {
  running = false;
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
  btnRun.textContent = '▶ Executar';
  btnRun.classList.remove('running');
}

function resetAll() {
  stopRunning();
  const dsType = selDataset.value;
  generateData(dsType);
  centroids = [];
  iteration = 0;
  converged = false;
  points.forEach(p => { p.cluster = -1; });
  updateUI();
  drawMain();
  drawElbow();
  drawSilhouette();
}

function updateUI() {
  iterLabel.textContent = iteration;
  convergedLabel.classList.toggle('show', converged);
  updateLegend();

  // Show/hide controls
  const isDB = currentAlgo === 'dbscan';
  grpK.style.display = isDB ? 'none' : '';
  grpEps.style.display = isDB ? '' : 'none';
  grpMinPts.style.display = isDB ? '' : 'none';

  // Update info box
  const infos = {
    kmeans: '<strong>K-Means:</strong> Particiona os dados em K clusters, minimizando a soma das distâncias ao quadrado de cada ponto ao centróide do seu cluster.',
    kmedoids: '<strong>K-Medoids:</strong> Similar ao K-Means, mas o centro é um ponto real do dataset (medoide), sendo mais robusto a outliers.',
    dbscan: '<strong>DBSCAN:</strong> Agrupa pontos por densidade. Detecta clusters de forma arbitrária e identifica ruído. Não requer K pré-definido.'
  };
  infoBox.innerHTML = infos[currentAlgo] || '';
}

// ===================== TOOLTIP =====================
mainCanvas.addEventListener('mousemove', function(e) {
  const rect = mainCanvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  let closest = null, closestD = 20;
  points.forEach(p => {
    const d = Math.hypot(p.x - mx, p.y - my);
    if (d < closestD) { closestD = d; closest = p; }
  });

  if (closest) {
    hoveredPoint = closest;
    const clusterText = closest.cluster < 0 ? 'Ruído' : `Cluster ${closest.cluster + 1}`;
    tooltip.innerHTML = `<strong>${closest.name}</strong><br>Cluster: ${clusterText}<br>Indicador 1: ${closest.indicador1}<br>Indicador 2: ${closest.indicador2}`;
    tooltip.style.display = 'block';

    // Position tooltip
    const tipX = e.clientX - mainCanvas.parentElement.getBoundingClientRect().left + 15;
    const tipY = e.clientY - mainCanvas.parentElement.getBoundingClientRect().top - 10;
    tooltip.style.left = tipX + 'px';
    tooltip.style.top = tipY + 'px';
    drawMain();
  } else {
    if (hoveredPoint) {
      hoveredPoint = null;
      tooltip.style.display = 'none';
      drawMain();
    }
  }
});

mainCanvas.addEventListener('mouseleave', function() {
  hoveredPoint = null;
  tooltip.style.display = 'none';
  drawMain();
});

// ===================== EVENT LISTENERS =====================
selAlgo.addEventListener('change', function() {
  currentAlgo = this.value;
  stopRunning();
  initAlgorithm();
  drawMain();
  drawSilhouette();
  updateUI();
});

selDataset.addEventListener('change', function() {
  resetAll();
});

sliderK.addEventListener('input', function() {
  valK.textContent = this.value;
  if (!running) {
    stopRunning();
    initAlgorithm();
    drawMain();
    drawElbow();
    drawSilhouette();
  }
});

sliderEps.addEventListener('input', function() {
  valEps.textContent = parseFloat(this.value).toFixed(1);
});

sliderMinPts.addEventListener('input', function() {
  valMinPts.textContent = this.value;
});

sliderSpeed.addEventListener('input', function() {
  valSpeed.textContent = speedLabel(parseInt(this.value));
});

btnRun.addEventListener('click', function() {
  if (running) {
    stopRunning();
  } else {
    if (converged) {
      // Re-init if converged
      initAlgorithm();
      drawMain();
    }
    startRunning();
  }
});

btnStep.addEventListener('click', function() {
  stopRunning();
  if (converged) return;
  doStep();
});

btnReset.addEventListener('click', function() {
  resetAll();
});

// ===================== RESPONSIVE CANVAS =====================
function resizeCanvases() {
  const elbowRect = elbowCanvas.parentElement;
  const silRect = silCanvas.parentElement;

  // High DPI support
  const dpr = window.devicePixelRatio || 1;

  [mainCanvas, elbowCanvas, silCanvas].forEach(c => {
    const rect = c.parentElement;
    const displayW = c === mainCanvas ? Math.min(560, rect.clientWidth - 20) : rect.clientWidth - 32;
    const displayH = c === mainCanvas ? displayW : Math.min(200, displayW * 0.45);

    c.style.width = displayW + 'px';
    c.style.height = displayH + 'px';
  });
}

// ===================== INIT =====================
function init() {
  generateData('3clusters');
  initAlgorithm();
  updateUI();
  drawMain();
  drawElbow();
  drawSilhouette();
  valSpeed.textContent = speedLabel(getSpeed());
  resizeCanvases();
}

window.addEventListener('resize', function() {
  resizeCanvases();
  drawElbow();
  drawSilhouette();
});

init();
</script>
